name: Sync Repository Labels

on:
  push:
    branches:
      - main
    paths:
      - '.github/labels.yml'
  workflow_dispatch: {}

permissions:
  contents: write
jobs:
  sync-labels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - scavenger-infra-as-code
          - scavenger-core-gateway
          - scavenger-cv-engine
          - scavenger-e2e-framework

    steps:
      - name: Sync Labels in ${{ matrix.repo }}
        uses: EndBug/label-sync@v2
        with:
          source-repo: Logika-Sciuro/.github
          token: ${{ secrets.ORG_PAT_ISSUES_WRITE }}
          delete-other-labels: true
