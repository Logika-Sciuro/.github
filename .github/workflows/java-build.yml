name: Java Build

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: '21'
      maven-version:
        required: false
        type: string
        default: '3.9.x'
      check-name:
        required: false
        type: string
        default: 'build'

jobs:
  build:
    name: ${{ inputs.check-name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run tests
        run: mvn test

      - name: Run code quality checks
        run: mvn verify
