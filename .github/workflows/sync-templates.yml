name: Sync Issue Templates

on:
  push:
    paths:
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  sync-templates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: List repositories
        id: list-repos
        run: |
          repos=$(gh repo list Logika-Sciuro --json name --jq '.[].name' | tr '\n' ' ')
          echo "repositories=${repos}" >> "$GITHUB_OUTPUT"

      - name: Sync templates to all repositories
        env:
          # ORG_SYNC_TOKEN must be able to update contents in the target repositories.
          GH_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "ORG_SYNC_TOKEN secret is required to sync templates across repositories." >&2
            exit 1
          fi

          REPOS="${{ steps.list-repos.outputs.repositories }}"
          for REPO in $REPOS; do
            if [ "${REPO}" != ".github" ]; then
              echo "Syncing templates to $REPO"
              for TEMPLATE in bug_report.md feature_request.md; do
                TEMPLATE_PATH=".github/ISSUE_TEMPLATE/${TEMPLATE}"
                CONTENT=$(base64 "${TEMPLATE_PATH}" | tr -d '\n')
                SHA=""

                if ! SHA=$(gh api "repos/Logika-Sciuro/${REPO}/contents/${TEMPLATE_PATH}" --jq '.sha' 2>&1); then
                  if [[ "${SHA}" != *"404"* ]]; then
                    printf '%s\n' "${SHA}" >&2
                    exit 1
                  fi

                  SHA=""
                fi

                if [ -n "${SHA}" ]; then
                  gh api "repos/Logika-Sciuro/${REPO}/contents/${TEMPLATE_PATH}" \
                    -X PUT \
                    -f message="Sync ${TEMPLATE}" \
                    -f content="${CONTENT}" \
                    -f sha="${SHA}"
                else
                  gh api "repos/Logika-Sciuro/${REPO}/contents/${TEMPLATE_PATH}" \
                    -X PUT \
                    -f message="Sync ${TEMPLATE}" \
                    -f content="${CONTENT}"
                fi
              done
            fi
          done
