name: Sync Issue Templates

on:
  push:
    paths:
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  sync-templates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: List repositories
        id: list-repos
        run: |
          repos=$(gh repo list Logika-Sciuro --json name --jq '.[].name' | tr '\n' ' ')
          echo "repositories=${repos}" >> "$GITHUB_OUTPUT"

      - name: Sync templates to all repositories
        env:
          GH_TOKEN: ${{ secrets.ORG_SYNC_TOKEN != '' && secrets.ORG_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          REPOS="${{ steps.list-repos.outputs.repositories }}"
          for REPO in $REPOS; do
            if [ "${REPO}" != ".github" ]; then
              echo "Syncing templates to $REPO"
              for TEMPLATE in bug_report.md feature_request.md; do
                TEMPLATE_PATH=".github/ISSUE_TEMPLATE/${TEMPLATE}"
                CONTENT=$(base64 "${TEMPLATE_PATH}" | tr -d '\n')
                SHA=""

                if ! SHA=$(gh api "repos/Logika-Sciuro/${REPO}/contents/${TEMPLATE_PATH}" --jq '.sha' 2>gh-error.log); then
                  if ! grep -q "404" gh-error.log; then
                    cat gh-error.log >&2
                    rm -f gh-error.log
                    exit 1
                  fi
                fi

                rm -f gh-error.log

                if [ -n "${SHA}" ]; then
                  gh api "repos/Logika-Sciuro/${REPO}/contents/${TEMPLATE_PATH}" \
                    -X PUT \
                    -f message="Sync ${TEMPLATE}" \
                    -f content="${CONTENT}" \
                    -f sha="${SHA}"
                else
                  gh api "repos/Logika-Sciuro/${REPO}/contents/${TEMPLATE_PATH}" \
                    -X PUT \
                    -f message="Sync ${TEMPLATE}" \
                    -f content="${CONTENT}"
                fi
              done
            fi
          done
